# Brings up PostgreSQL + the NestJS API with a single `docker-compose up`.
# The API container runs pending migrations before starting.
services:
  postgres:
    image: postgres:15-alpine
    container_name: talentbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentbridge
      POSTGRES_PASSWORD: talentbridge
      POSTGRES_DB: talentbridge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talentbridge -d talentbridge']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentbridge-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network the DB host is the service name `postgres`.
      DATABASE_URL: postgres://talentbridge:talentbridge@postgres:5432/talentbridge
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - '3000:3000'

volumes:
  pgdata:
